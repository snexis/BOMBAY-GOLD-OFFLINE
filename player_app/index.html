<!-- Login Modal -->
    <div id="login-modal" class="modal-overlay">
        <div class="login-card">
            <h2>A2Z BOMBAY LOGIN</h2>
            <p>Enter your ID and Password</p>
            <form id="login-form">
                <div class="form-group">
                    <label for="user-type">User Type:</label>
                    <select id="user-type">
                        <option value="demo">Demo Player</option>
                        <option value="real">Real Player</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" value="DEMO_PLAYER_01" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" value="123456" required>
                </div>
                <button type="submit" class="btn-submit">Login</button>
            </form>
        </div>
    </div>
